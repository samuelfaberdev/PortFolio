<!DOCTYPE html>
<!--
  Source de public/og-image-en.jpg (version anglaise de og-image.html) (aperçu des liens partagés, 1200 × 630).
  Pour la régénérer : ouvrir ce fichier dans Chrome, régler la fenêtre sur 1200 × 630
  (outils de développement, mode responsive), puis « Capturer une capture d'écran », puis convertir en JPEG qualité 90 (< 300 Ko pour WhatsApp).
-->
<html lang="en"><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; background:#0a0a0a; color:#ededed; font-family: Arial, Helvetica, sans-serif; overflow:hidden; position:relative; }
  .glow { position:absolute; width:700px; height:700px; right:-160px; top:-120px; border-radius:50%;
          background: radial-gradient(circle, rgba(236,72,153,.28) 0%, rgba(251,146,60,.12) 45%, transparent 70%); }
  .wrap { position:relative; display:flex; align-items:center; justify-content:space-between; height:100%; padding:0 80px; gap:48px; }
  .left { display:flex; flex-direction:column; gap:22px; max-width:680px; }
  .brand { display:flex; align-items:center; gap:14px; font-size:30px; }
  .brand img { width:46px; height:46px; }
  .grad { background:linear-gradient(135deg,#ec4899,#fb923c); -webkit-background-clip:text; background-clip:text; color:transparent; }
  h1 { font-size:76px; line-height:1.05; font-weight:700; }
  .title { font-size:32px; line-height:1.3; color:#d4d4d4; }
  .tags { display:flex; gap:12px; flex-wrap:wrap; }
  .tag { border:2px solid #404040; border-radius:999px; padding:8px 18px; font-size:22px; color:#d4d4d4; }
  .cta { align-self:flex-start; margin-top:6px; border-radius:999px; padding:14px 26px; font-size:23px; white-space:nowrap; font-weight:700; color:#fff;
         background:linear-gradient(135deg,#ec4899,#fb923c); }
  .photo { flex:none; width:340px; height:340px; border-radius:50%; padding:8px; background:linear-gradient(135deg,#ec4899,#fb923c); }
  .photo img { width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; border:6px solid #0a0a0a; }
</style></head><body>
  <div class="glow"></div>
  <div class="wrap">
    <div class="left">
      <div class="brand"><img src="../public/images/icone.svg" alt=""><span class="grad">samuelfaber.dev</span></div>
      <h1>Samuel Faber</h1>
      <p class="title">Web &amp; AI<br>Application Developer</p>
      <div class="tags"><span class="tag">Data Engineering</span><span class="tag">MLOps</span><span class="tag">Python</span><span class="tag">Docker</span></div>
      <div class="cta">Open to work-study or full-time · Data Engineering / MLOps</div>
    </div>
    <div class="photo"><img src="../public/images/profil.jpg" alt=""></div>
  </div>
</body></html>
