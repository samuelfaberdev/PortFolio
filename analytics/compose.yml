# Umami : statistiques de visite du portfolio
# Basé sur le docker-compose.yml officiel d'Umami (v3.5.0).
# Lancement : docker compose -f analytics/compose.yml up -d

services:
  umami:
    container_name: umami
    image: ghcr.io/umami-software/umami:latest
    # Uniquement accessible depuis le serveur : Caddy s'occupe du HTTPS
    ports:
      - "127.0.0.1:8600:3000"
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:?Définir UMAMI_DB_PASSWORD dans analytics/.env}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?Définir UMAMI_APP_SECRET dans analytics/.env}
      TWO_FACTOR_ENCRYPTION_KEY: ${UMAMI_2FA_KEY:?Définir UMAMI_2FA_KEY dans analytics/.env}
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    container_name: umami-db
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  umami-db-data:
